name: CI

# Minimal CI gate (audit-06): push + PR must prove the repo installs, typechecks,
# passes its tests, and that the real entry points still START. Before this
# workflow, every one of those gates ran only when a human remembered to run it
# locally — see corpus/todos/2026-09-13-audit-06-ci-gate.md.
on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node floor: 24. The three places that claimed a version disagreed
      # (README said "20+", infrastructure/Dockerfile pins node:24-alpine,
      # @types/node is pinned 25.9.1) with no `engines` field anywhere to
      # settle it. Dockerfile is the one pin that reflects a REAL constraint —
      # it's what the sim server actually deploys on — so 24 is the honest
      # floor, not the loosest number that happens to work. It also clears
      # both vite's (`^20.19.0 || >=22.12.0`) and vitest's
      # (`^20.0.0 || ^22.0.0 || >=24.0.0`) own engines ranges. See the root
      # package.json `engines` field this same audit adds.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          # This caches npm's package-download cache (~/.npm, keyed off
          # package-lock.json) — NOT Turborepo's .turbo task-output cache.
          # Those are different caches with different honesty properties; see
          # the note below `npm ci` for why the .turbo one stays off.
          cache: "npm"

      - run: npm ci

      # --- Static + unit gates ------------------------------------------------
      #
      # No cross-run cache restore for Turborepo's .turbo directory. audit-01
      # (commit 436a66a) fixed typecheck/test to use `^topological` deps so a
      # downstream package's cache key correctly folds in its dependencies'
      # source — the cache is no longer WRONG. But a restored cache across CI
      # runs is a different claim: it would let a PR that touches nothing typecheck-
      # or test-relevant report success without those tasks having executed
      # AT ALL on that PR's own worker. A cold .turbo cache every run is the
      # honest default — it still gets turbo's intra-run parallelism (all 19
      # workspaces typecheck in one `--continue=always` pass) and the
      # `--concurrency=1` serialization on `test` (the atlas-builder /
      # sim-core write/read race — see turbo.json) is unaffected either way.
      # Revisit cross-run restore once this workflow itself has run clean a
      # few times and someone wants to pay for a `.turbo` remote/actions
      # cache — that's a separate, deliberate follow-up, not a default to
      # fall into.
      - run: npm run typecheck
      - run: npm run test

      # --- Startup smoke: "verification must include running things" --------
      #
      # corpus/wiki/decisions.md records that a green typecheck plus 689
      # passing tests did NOT catch the WebGL2 renderer's dynamic-import
      # requirement breaking every headless Node consumer
      # (ERR_UNKNOWN_FILE_EXTENSION on a `*.glsl?raw` import) — nothing
      # automated the one thing that would have: proving the entry points
      # actually start. These five steps are startup smoke, not behavior
      # runs — tiny budgets, seconds each (measured locally, see the audit-06
      # handoff notes / PR description for wall times), asserting only that
      # each command exits 0.
      - run: npm run build

      - name: smoke - sim (Farm)
        run: MAX_DAYS=1 TICKS_PER_DAY=20 npm run sim

      - name: smoke - sim:citadel
        run: MAX_DAYS=1 TICKS_PER_DAY=20 npm run sim:citadel

      - name: smoke - sim:hollow
        # NOT MAX_DAYS/TICKS_PER_DAY: tools/hollow-sim reads MAX_YEARS (its
        # run-length knob) and TICKS_PER_YEAR (its CSV sampling cadence) — see
        # tools/hollow-sim/src/env.ts. TICKS_PER_DAY is accepted too, but it
        # only sets the sim's internal day length (default 20, already tiny);
        # it does not bound how long the run is. MAX_DAYS is not read at all,
        # so passing it here would silently no-op and the default MAX_YEARS=15
        # would run instead — still fast (~1.5k ticks), but not the minimal
        # smoke budget the other two steps use. MAX_YEARS=1 is the equivalent
        # tiny budget for this tool.
        run: MAX_YEARS=1 npm run sim:hollow

      - name: smoke - preview
        run: npm run preview

      # --- Publish-path smoke: "a gate nobody runs isn't a gate" -------------
      #
      # examples/library-consumer (audit-30) is a fixture that proves the
      # @engine/core / @engine/ui / @engine/wasm-modules npm-pack tarballs
      # resolve and run with ZERO fallback to monorepo source -- i.e. that the
      # packages are genuinely publishable, not just that `npm pack` exits 0.
      # It is deliberately OUTSIDE the root workspaces globs so its install
      # comes from real tarballs via `file:`, not a workspace symlink. Before
      # this step, nothing ever ran it -- a repo-wide grep for
      # "library-consumer" outside its own directory returned nothing, so a
      # broken `exports` map, a broken pack-swap.mjs, or a broken
      # publishConfig would stay green on `npm run typecheck` / `npm run test`
      # and only surface at actual publish time, or to a consumer.
      #
      # Measured locally: ~7-12s (three `npm pack`s, each running that
      # package's real `build`, plus a fixture-local `npm install` and the
      # Node smoke itself). That is in the same tiny-budget class as the five
      # startup-smoke steps above, so it runs on every push rather than being
      # gated to `engine/**` changes -- gating it would let a change to
      # pack-swap.mjs or a game's use of the engine barrel go unnoticed if it
      # happened not to touch engine/** in the same diff.
      #
      # `--package-lock=false` on the fixture's own install: the fixture has
      # no committed package-lock.json, by design (see its README) -- a lock
      # would pin the `file:` tarballs' integrity hashes, and those go stale
      # the moment engine source changes and the freshly-packed tarball's
      # content no longer matches. `--package-lock=false` stops npm from
      # writing one during this install (it writes one on a plain
      # `npm install` even with none committed), so each run re-resolves
      # from the freshly-built tarballs on their own merits.
      #
      # Ordering invariant: this step must run AFTER `npm run test` above,
      # not before. `npm pack -w @engine/wasm-modules` here triggers that
      # package's `prepack` -> `build` -> `compile.mjs`, which REWRITES
      # `engine/wasm-modules/dist/*.wasm`, `dist/manifest.json`, and
      # `games/farm/client/public/wasm/*.wasm` in place. Audit-29's
      # check-drift guard (this package's `test` script) only means anything
      # because it runs against the committed artifacts BEFORE pack-smoke
      # regenerates them -- reorder this step ahead of `npm run test` and the
      # drift guard would compare freshly-rebuilt output to itself and could
      # never fail.
      - name: smoke - pack (library-consumer)
        run: npm run pack-smoke
