<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MateQuest</title>
  </head>
  <body>
    <!-- M1: main.ts boots the sim worker and renders the combat screen (enemy/warrior HP,
         action menu, math-problem keypad, result cues, win/lose banner) into #scene via
         @engine/ui — see src/ui/combat-screen.ts. -->
    <div id="app">
      <canvas id="scene"></canvas>
    </div>
    <!-- Hidden a11y mirror mount for the in-canvas combat screen (see @engine/ui's
         createA11yMirror) — a visually-hidden, screen-reader-visible DOM subtree that
         structurally mirrors the widget tree, same pattern as Citadel's #ui-a11y-mirror. -->
    <div id="ui-a11y-mirror"></div>
    <!-- audit-52: a SECOND mirror mount, owned by the spatial map screen (src/ui/map-mirror.ts).
         The map is custom-drawn, so @engine/ui's widget mirror cannot reach it — and node choice
         is the roguelike's only strategic decision. Separate mount so the two mirrors never fight
         over one subtree. Hidden via inline sr-only styles, NOT display:none (which would remove
         it from the accessibility tree and the tab order). -->
    <div id="ui-a11y-map"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
